[package]
name = "common"
version = "0.3.0"
edition = "2021"
rust-version = "1.80"
description = "Shared helpers for Sootmark parsers: timestamps, bounded byte reading, UTF-16 text, Windows SIDs and GUIDs."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/common"
publish = false

# No runtime dependencies on purpose: builds everywhere, including wasm32.
[dependencies]

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
